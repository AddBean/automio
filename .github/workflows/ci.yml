name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :publish:zpublishScript:assembleDebug --no-daemon --stacktrace

      - name: Android lint
        run: ./gradlew :publish:zpublishScript:lintDebug --no-daemon --stacktrace

      - name: i18n scan
        run: ./gradlew scanI18n --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: automio-debug-apk
          path: publish/zpublishScript/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Secret scan
        # gitleaks-action 对私有仓需商业许可；改用开源 CLI
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
