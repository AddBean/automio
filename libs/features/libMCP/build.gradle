plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "com.hive.mcp"
    compileSdk rootProject.ext.android.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.android.minSdkVersion
        targetSdk rootProject.ext.android.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.javaVersion.toString()
    }
    buildFeatures {
        viewBinding true
        buildConfig true  // Required for BuildConfig in AGP 9.0.0
    }

}

dependencies {
    implementation rootProject.ext.publicDependencies.markwonCore
    implementation rootProject.ext.publicDependencies.markwonHtml
    implementation rootProject.ext.publicDependencies.markwonTable
    implementation rootProject.ext.publicDependencies.markwonImage
    implementation rootProject.ext.publicDependencies.markwonImageGlide
    implementation rootProject.ext.publicDependencies.androidSvg

    implementation rootProject.ext.publicDependencies.okhttp

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':libs:framework:libUtils')
    implementation project(path: ':libs:framework:libNet')
    implementation project(path: ':libs:framework:libCompon')
}
