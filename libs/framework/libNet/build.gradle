apply plugin: 'com.android.library'
android {
    namespace "com.hive.net"
    compileSdk rootProject.ext.android.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.android.minSdkVersion
        targetSdk rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api project(path: ':libs:framework:libUtils')
    implementation project(path: ':libs:framework:libCompon')

    api rootProject.ext.publicDependencies.okhttp
    api rootProject.ext.publicDependencies.retrofit2Gson
    api rootProject.ext.publicDependencies.retrofit2
    api rootProject.ext.publicDependencies.retrofit2Rx
    api rootProject.ext.publicDependencies.glide
    annotationProcessor rootProject.ext.publicDependencies.glideProcessor
}
