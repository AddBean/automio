plugins {
    id 'com.android.library'
    id 'kotlin-android'
    
}
android {
    namespace "com.hive.base"
    compileSdk rootProject.ext.android.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.android.minSdkVersion
        targetSdk rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.javaVersion.toString()
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api project(path: ':libs:framework:libUtils')
    api project(path: ':libs:framework:libViews')
    api project(path: ':libs:framework:libCompon')
    api project(path: ':libs:framework:libNet')

    api rootProject.ext.publicDependencies.androidxLifecycleLivedata
    api rootProject.ext.publicDependencies.androidxLifecycleViewmodel
    api rootProject.ext.publicDependencies.androidxMultidex
}
