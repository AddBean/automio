// Top-level build file where you can add configuration options common to all sub-projects/modules.
System.out.println("***************配置组件********************")
apply from: "common.gradle"
apply from: "libVersion.gradle"
apply from: "config.gradle"
buildscript {
    ext.kotlin_version = '2.1.0'
    ext.gradle_tools_version = '8.0.0'
    repositories {
        mavenLocal()
        maven { url "https://raw.githubusercontent.com/AddBean/commonLib/main/android" }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/central/' }
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url "https://jitpack.io/" }
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_tools_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0" //Added line
        classpath "com.google.code.gson:gson:2.8.9"

    }
}

allprojects {
    repositories {
        mavenLocal()
        maven { url "https://raw.githubusercontent.com/AddBean/commonLib/main/android" }
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/central/' }
        maven { url 'https://repo1.maven.org/maven2' }
        maven { url "https://jitpack.io/" }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
