/**
 * 常用工具类；
 */
class GradleUtils {

    private static int hashToInt(String str) {
        try {
            MessageDigest md = MessageDigest.getInstance("SHA-1");
            byte[] bytes = md.digest(str.getBytes());
            BigInteger num = new BigInteger(1, bytes);
            int hash = num.intValue();
            return Math.abs(hash % 100000); // 取模
        } catch (NoSuchAlgorithmException e) {
            throw new RuntimeException("SHA-1 algorithm not found.", e);
        }
    }

    private static String execGitCmd(String cmd, Project project) {
        def result = cmd.execute().text.trim()
        System.out.println("project.rootDir=" + project.rootDir)
        //如果获取失败，则重新切换目录再获取
        if (result == "" || result == null) {
            result = cmd.execute([], project.rootDir).text.trim()
        }
        if (result == "" || result == null) {
            return "5000"
        }
        return result
    }


    /**
     * 获取最后一次git commit
     * @return
     */
    static Map<String, String> gitLastCommit(Project project) {
        String commitId = execGitCmd("git rev-parse HEAD", project)
        String commitTime = execGitCmd("git show --pretty=format:\"%ci\" | head -1", project)
        System.out.println("commitTime=" + commitTime)
        Map<String, String> map = new HashMap<String, String>()
        map.put("commitId", commitId)
        map.put("commitTime", commitTime)
        System.out.println("gitLastCommit=" + map)
        return map
    }


    /**
     * 获取git commit 版本号
     * @return
     */
    static int gitRevision(int paddingVersion, Project project) {
        def vcode = 0
        // 优先尝试获取所有分支的提交数
        try {
            def result = execGitCmd("git rev-list --all --count", project)
            vcode = result.toInteger()
        } catch (Exception e) {
            System.out.println("git rev-list --all --count failed: " + e.getMessage())
        }
        
        // 如果获取失败或为 0，尝试只计算当前分支（适用于浅克隆场景）
        if (vcode == 0) {
            try {
                def result = execGitCmd("git rev-list --count HEAD", project)
                vcode = result.toInteger()
                System.out.println("Using HEAD count instead of --all: " + vcode)
            } catch (Exception e) {
                System.out.println("git rev-list --count HEAD failed: " + e.getMessage())
            }
        }
        
        // 如果仍然为 0，使用默认值
        if (vcode == 0) {
            vcode = 1000
            System.out.println("Using default versionCode: " + vcode)
        } else {
            vcode = vcode.toInteger() + 2431 - paddingVersion
        }
        
        // 确保 versionCode 始终为正整数（Android 要求）
        if (vcode < 1) {
            vcode = 1
        }
        System.out.println("gitRevision =" + vcode)
        return vcode
    }

    /**
     * 获取版本名
     * @return
     */
    static String getRevisionName(int paddingVersion, Project project) {
        int verCode = gitRevision(paddingVersion, project)
        int v1 = (verCode / 1000)
        int v2 = ((verCode - v1 * 1000) / 100)
        int v3 = verCode % 100
        return "" + v1 + "." + v2 + "." + (v3 > 9 ? "" : "0") + v3
    }


    /**
     * 获取app名
     * @param flavorStr
     * @return
     */
    static String getFlavorName(String flavorStr) {
        String[] names = flavorStr.split("_")
        if (names.length == 0) return flavorStr
        return names[0]
    }

    /**
     * 获取渠道名
     * @param flavorStr
     * @return
     */
    static String getChannelName(String flavorStr) {
        String[] names = flavorStr.split("_")
        if (names.length == 1) return flavorStr
        return names[1]
    }

    static def getLocalPropertiesValue(String key, Project project) {
        Properties properties = new Properties()
        InputStream inputStream = project.rootProject.file('local.properties').newDataInputStream()
        properties.load(inputStream)
        return properties.getProperty(key)
    }

    /**
     * 获取当前app名;
     * @return
     */
    static def getCurrentFlavor(groovy.lang.Script script, Project project) {
        Gradle gradle = script.getGradle()
        String tskReqStr = gradle.getStartParameter().getTaskRequests().toString()
        Pattern pattern
        println "tskReqStr=" + tskReqStr
        if (tskReqStr.contains("assemble"))
            pattern = Pattern.compile("assemble(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("bundle"))
            pattern = Pattern.compile("bundle(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("extractApksFor"))
            pattern = Pattern.compile("extractApksFor(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("MoveDir"))
            pattern = Pattern.compile("MoveDir(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("AllProguardTask"))
            pattern = Pattern.compile("AllProguardTask(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("FileChangeTask"))
            pattern = Pattern.compile("FileChangeTask(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("OtherClassGuardTask"))
            pattern = Pattern.compile("OtherClassGuardTask(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("PackageChange"))
            pattern = Pattern.compile("PackageChange(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("RChange"))
            pattern = Pattern.compile("RChange(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("StringEncodeTask"))
            pattern = Pattern.compile("StringEncodeTask(\\w+)(Release|Debug)")
        else if (tskReqStr.contains("XmlClassGuard"))
            pattern = Pattern.compile("XmlClassGuard(\\w+)(Release|Debug)")
        else
            pattern = Pattern.compile("generate(\\w+)(Release|Debug)")
        Matcher matcher = pattern.matcher(tskReqStr)

        if (matcher.find()) {
            String currentFlavor = matcher.group(1).toLowerCase()
            println("getCurrentFlavor=" + currentFlavor)
            return currentFlavor
        } else {
            println "NO MATCH FOUND"
            return "main_main"
        }
    }

    static def findPublishModule(Project project) {
        def projects = project.getChildProjects().find { it.key.startsWith("publish") }.value.childProjects
//        if (projects.size() > 1) {
//            println "\n\n\npublish模块只能生效一个，请修改setting.gradle!!\npublish模块只能生效一个，请修改setting.gradle!!\npublish模块只能生效一个，请修改setting.gradle!!\n\n\n"
//            throw Exception("")
//        }
        def path = "." + projects.values()[0].path.replace(":", '/') + "/"
        println "project path=" + path
        return path
    }

    /**
     * 获取当前publish路径;
     * @return
     */
    static def getCurrentModulePath(groovy.lang.Script script, Project project) {
        Gradle gradle = script.getGradle()
        String tskReqStr = gradle.getStartParameter().getTaskRequests().toString()
        Pattern pattern
        println "tskReqStr=" + tskReqStr
        pattern = Pattern.compile("publish:(.*?):(clean|assemble|bundle|extractApksFor|generate)")
        Matcher matcher = pattern.matcher(tskReqStr)
        if (matcher.find())
            // 保持原始大小写，避免 Linux 系统上的路径大小写敏感问题
            return "publish/" + matcher.group(1) + "/"
        else {
            println "NO MATCH FOUND"
            return findPublishModule(project)
        }
    }


    /**
     * 获取当前时间；
     * @return
     */
    static String getTime() {
        return new Date().format("yyyy-MM-dd")
    }

    /**
     * release包名称
     * @param script
     * @return
     */
    static String getReleaseName(groovy.lang.Script script) {
        StringBuilder builder = new StringBuilder();
        builder.append(script.rootProject.ext.android.flavorName);
        builder.append("_build(" + script.rootProject.ext.android.versionCode + ")");
        builder.append("_ver(" + script.rootProject.ext.android.versionName + ")");
        builder.append("_release_(" + getTime() + ")");
        builder.append(".apk");
        return builder.toString();
    }
    /**
     * debug名称
     * @param script
     * @return
     */
    static String getDebugName(groovy.lang.Script script) {
        StringBuilder builder = new StringBuilder();
        builder.append(script.rootProject.ext.android.flavorName);
        builder.append("_build(" + script.rootProject.ext.android.versionCode + ")");
        builder.append("_ver(" + script.rootProject.ext.android.versionName + ")");
        builder.append("_debug_(" + getTime() + ")");
        builder.append(".apk");
        return builder.toString();
    }

    static String readToFile(String path) {
        File file = new File(path);
        StringBuilder sb = new StringBuilder();
        file.readLines().forEach(new Consumer<String>() {
            @Override
            void accept(String s) {
                sb.append(s);
                sb.append("\n");
            }
        })
        return sb.toString();
    }

    static void writeToFile(String path, String content) {
        File file = new File(path);
        if (file.exists()) {
            file.createNewFile();
        }
        FileWriter writer = new FileWriter(file);
        writer.write(content);
        writer.flush();
        writer.close();
        return;
    }

    static String getDesktopPath() {
        File desktopDir = FileSystemView.getFileSystemView().getHomeDirectory();
        String desktopPath = desktopDir.getAbsolutePath()
        return desktopPath;
    }

}



